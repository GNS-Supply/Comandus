<!doctype html>
<html lang="pt-BR" data-tema="noite" data-textura="grade" data-forma="suave" data-moldura="arco">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17101f">
<title>MesaViva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="aurora" aria-hidden="true"></div>
<header class="topo">
  <div class="marca"><i></i><b>MesaViva</b></div>
  <nav id="nav" class="nav" aria-label="Visões"></nav>
  <button id="btnLogin" class="btn fantasma" style="display:none">Sair</button>
  <button id="btnEstudio" class="btn fantasma" aria-label="Abrir estúdio de tema">Estúdio</button>
</header>
<main id="app"></main>
<aside id="estudio" class="estudio" aria-label="Estúdio de tema">
  <h3>Estúdio visual</h3>
  <label>Tema<div id="optTema" class="opts"></div></label>
  <label>Cor da marca<input type="color" id="corMarca" value="#ffb547"></label>
  <label>Formato<div id="optForma" class="opts"></div></label>
  <label>Moldura da foto<div id="optMoldura" class="opts"></div></label>
  <label>Textura<div id="optTextura" class="opts"></div></label>
  <label>Cardápio<div id="optLayout" class="opts"></div></label>
</aside>
<div id="toast" class="toast" role="status"></div>
<script type="module" src="app.js"></script>
</body>
</html>
